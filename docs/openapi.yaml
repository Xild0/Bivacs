    patch:
      tags: [Supporto]
      summary: Archivia ticket (Supporto Tecnico)
      description: Archivia un ticket gia chiuso e aggiorna la segnalazione associata. Riservato al Supporto Tecnico.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 6a5555555555555555555555
      responses:
        "200":
          description: Ticket archiviato
          content:
            application/json:
              schema:
                type: object
                properties:
                  messaggio:
                    type: string
                  ticket:
                    $ref: "#/components/schemas/Ticket"
        "400":
          description: Il ticket deve essere chiuso prima di poter essere archiviato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errore"
        "401":
          description: Non autorizzato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errore"
        "404":
          description: Ticket non trovato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errore"
