  /api/v1/meteo/{bivaccoId}:
    get:
      tags: [Meteo]
      summary: Meteo realtime bivacco
      description: Restituisce le condizioni meteo attuali. Usa MeteoTrentino come provider primario e Open-Meteo come fallback. Cache 30 minuti.
      parameters:
        - name: bivaccoId
          in: path
          required: true
          schema:
            type: string
          example: 6a057945e53a4acc0f4bf812
      responses:
        "200":
          description: Dati meteo
          content:
            application/json:
              schema:
                type: object
                properties:
                  bivacco:
                    type: object
                  provider:
                    type: string
                  stazione:
                    type: string
                    nullable: true
                  meteo:
                    $ref: "#/components/schemas/DatoMeteo"
        "404":
          description: Bivacco non trovato
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "500":
          description: Errore recupero meteo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/meteo/{bivaccoId}/previsioni:
    get:
      tags: [Meteo]
      summary: Previsioni meteo bivacco
      description: Restituisce le previsioni meteo per i prossimi 3 giorni tramite Open-Meteo.
      parameters:
        - name: bivaccoId
          in: path
          required: true
          schema:
            type: string
          example: 6a057945e53a4acc0f4bf812
      responses:
        "200":
          description: Previsioni meteo
          content:
            application/json:
              schema:
                type: object
                properties:
                  bivacco:
                    type: object
                  previsioni:
                    type: array
                    items:
                      type: object
                      properties:
                        giorno:
                          type: string
                          format: date
                        temperaturaMin:
                          type: number
                        temperaturaMax:
                          type: number
                        precipitazioni:
                          type: number
